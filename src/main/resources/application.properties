# Nombre de la aplicación
spring.application.name=medicore-server
server.port=8080
spring.main.log-startup-info=true

#PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/medicore_db
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver
#server.servlet.context-path=
jwt.secret=YzRkZDM0ZGFmZGM0ZDg0ZDFkYzU0ZDFjYzY0ZDA0ZDE=
jwt.expiration=180000
server.error.include-stacktrace=never
server.error.include-message=never
#JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

#Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:dataBase/migrations
spring.flyway.baseline-on-migrate=true